<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetOracle — Value Hunting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════ RESET & ROOT ══════════ */
:root {
  --bg:        #08080f;
  --bg1:       #0e0e1a;
  --bg2:       #131320;
  --bg3:       #181828;
  --border:    rgba(255,255,255,0.07);
  --borderacc: rgba(255,80,0,0.3);
  --c1: #ff4500;
  --c2: #ff7200;
  --c3: #ffb347;
  --grad:  linear-gradient(135deg,#ff4500,#ff7200);
  --grad2: linear-gradient(135deg,#ff7200,#ffb347);
  --text:  #eeeef5;
  --muted: #5c5c72;
  --dim:   #8f8fa8;
  --green: #22c55e;
  --red:   #f87171;
  --blue:  #60a5fa;
  --glow:  0 0 32px rgba(255,69,0,0.12);
  --radius: 14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 45% at 15% 5%,rgba(255,69,0,.07) 0%,transparent 65%),
    radial-gradient(ellipse 55% 40% at 85% 85%,rgba(255,114,0,.05) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}

/* ══════════ SCROLLBAR ══════════ */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg1);}
::-webkit-scrollbar-thumb{background:rgba(255,69,0,.35);border-radius:3px;}

/* ══════════ HEADER ══════════ */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,8,15,.88);
  backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}
.h-inner{
  max-width:1280px;margin:0 auto;
  padding:0 20px;height:60px;
  display:flex;align-items:center;gap:20px;
}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.logo-gem{
  width:34px;height:34px;border-radius:9px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  box-shadow:0 0 18px rgba(255,69,0,.45);
}
.logo-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;letter-spacing:2.5px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.logo-sub{
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:var(--c2);
  background:rgba(255,114,0,.12);border:1px solid rgba(255,114,0,.25);
  padding:2px 7px;border-radius:20px;text-transform:uppercase;
}
.h-spacer{flex:1;}
.h-meta{display:flex;gap:20px;align-items:center;}
.h-stat{text-align:right;}
.h-stat-v{
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;
  color:var(--c2);
}
.h-stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.h-date{
  background:var(--bg1);border:1px solid var(--border);
  color:var(--text);padding:7px 12px;border-radius:8px;
  font-size:12px;font-family:'DM Sans',sans-serif;
  cursor:pointer;outline:none;
}
.h-date:focus{border-color:var(--c1);}
.h-btn{
  background:var(--grad);color:#fff;border:none;
  padding:8px 18px;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:12px;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 16px rgba(255,69,0,.3);
  transition:all .2s;
}
.h-btn:hover{transform:translateY(-1px);box-shadow:0 5px 24px rgba(255,69,0,.45);}

/* ══════════ MAIN ══════════ */
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:22px 20px 60px;}

/* ══════════ STAT BANNER ══════════ */
.stat-banner{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:22px;
}
.s-card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 18px;
  position:relative;overflow:hidden;
}
.s-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--grad);opacity:.35;
}
.s-icon{font-size:20px;margin-bottom:6px;}
.s-val{
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;margin-bottom:3px;
}
.s-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px;}

/* ══════════ FILTER BAR ══════════ */
.filter-bar{
  display:flex;gap:8px;align-items:center;
  margin-bottom:20px;flex-wrap:wrap;
}
.f-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);margin-right:2px;
}
.chip{
  background:var(--bg1);border:1px solid var(--border);
  color:var(--dim);padding:6px 14px;border-radius:30px;
  font-size:11px;font-weight:600;cursor:pointer;
  transition:all .18s;white-space:nowrap;
}
.chip:hover,.chip.on{border-color:var(--c1);color:var(--c2);background:rgba(255,69,0,.07);}

/* ══════════ LEAGUE GROUP ══════════ */
.league-group{margin-bottom:28px;}
.league-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.league-flag{font-size:18px;}
.league-title{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;color:var(--dim);
}
.league-cnt{
  font-size:10px;font-weight:700;
  background:rgba(255,69,0,.12);border:1px solid rgba(255,69,0,.25);
  color:var(--c2);padding:2px 8px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}

/* ══════════ MATCH CARD ══════════ */
.match-card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:10px;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  animation:fadeUp .35s ease both;
}
.match-card:hover{border-color:var(--borderacc);box-shadow:var(--glow);}
.match-card.hot{border-color:rgba(255,69,0,.22);}
.match-card.hot .mc-topbar{background:var(--grad);}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Top bar */
.mc-topbar{
  height:2px;
  background:transparent;
  transition:background .2s;
}

/* Header row */
.mc-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px 0;
}
.mc-league{display:flex;align-items:center;gap:7px;}
.mc-league-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);}
.mc-right{display:flex;align-items:center;gap:8px;}
.mc-time{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--c2);background:rgba(255,114,0,.1);
  border:1px solid rgba(255,114,0,.2);padding:2px 8px;border-radius:5px;
}
.hot-badge{
  background:var(--grad);color:#fff;
  font-size:9px;font-weight:700;letter-spacing:1px;
  padding:2px 8px;border-radius:20px;text-transform:uppercase;
  animation:glow 2s infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(255,69,0,.4);}50%{box-shadow:0 0 18px rgba(255,69,0,.7);}}

/* Teams row */
.mc-teams{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 14px;
}
.mc-team{flex:1;display:flex;align-items:center;gap:10px;}
.mc-team.away{flex-direction:row-reverse;}
.team-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--bg2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.team-info{}
.team-name{font-size:14px;font-weight:600;line-height:1.2;}
.mc-team.away .team-info{text-align:right;}
.team-form{display:flex;gap:3px;margin-top:4px;}
.mc-team.away .team-form{justify-content:flex-end;}
.fd{
  width:13px;height:13px;border-radius:3px;
  font-size:7px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.fd.w{background:var(--green);}
.fd.d{background:#475569;}
.fd.l{background:var(--red);}

.vs-sep{
  font-family:'Bebas Neue',sans-serif;font-size:16px;
  color:var(--muted);letter-spacing:2px;flex-shrink:0;
}

/* ── PREDICTION SECTION (always visible) ── */
.mc-predictions{
  display:grid;grid-template-columns:1fr 1px 1fr;
  background:var(--bg2);
  border-top:1px solid var(--border);
}
.pred-sep{background:var(--border);}

/* 1X2 block */
.pred-block{padding:14px 16px;}
.pred-title{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
  margin-bottom:11px;
}
.pred-title::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--c1);display:inline-block;
  box-shadow:0 0 6px var(--c1);
}

.odds-row{display:flex;gap:7px;}
.odd-item{
  flex:1;background:var(--bg3);border:1px solid var(--border);
  border-radius:9px;padding:9px 5px;text-align:center;
  cursor:default;transition:all .18s;position:relative;overflow:hidden;
}
.odd-item.pick{
  border-color:var(--c1);background:rgba(255,69,0,.07);
}
.odd-item.pick::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--grad);
}
.odd-lbl{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--muted);margin-bottom:2px;
}
.odd-val{
  font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;
  color:var(--text);
}
.odd-item.pick .odd-val{color:var(--c2);}
.odd-pct{font-size:10px;color:var(--muted);margin-top:2px;}
.odd-item.pick .odd-pct{color:var(--c1);}

/* IY block */
.iy-content{display:flex;align-items:center;gap:12px;}
.iy-bars{flex:1;display:flex;flex-direction:column;gap:7px;}
.iy-row{display:flex;align-items:center;gap:8px;}
.iy-lbl{font-size:11px;font-weight:500;color:var(--dim);min-width:56px;}
.iy-track{flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.iy-fill{height:100%;border-radius:4px;background:var(--grad);transition:width 1s ease;}
.iy-fill.under{background:linear-gradient(90deg,#475569,#64748b);}
.iy-pct{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  min-width:38px;text-align:right;
}
.iy-pct.hot{color:var(--c2);}
.iy-pct.cold{color:var(--muted);}

.iy-badge{
  background:var(--bg3);border:1px solid var(--borderacc);
  border-radius:9px;padding:9px 14px;text-align:center;min-width:68px;flex-shrink:0;
}
.iy-badge-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px;}
.iy-badge-val{
  font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--c2);
}

/* Confidence */
.mc-conf{padding:10px 18px 14px;background:var(--bg2);}
.conf-track{height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.conf-fill{height:100%;border-radius:2px;background:var(--grad);transition:width 1.2s ease;}
.conf-labels{display:flex;justify-content:space-between;margin-top:5px;}
.conf-lbl{font-size:10px;color:var(--muted);}
.conf-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--c2);}

/* loading skeleton per card */
.mc-loading{
  display:flex;align-items:center;justify-content:center;
  padding:24px;gap:10px;
}
.spin{
  width:20px;height:20px;
  border:2px solid rgba(255,69,0,.12);
  border-top-color:var(--c1);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-lbl{font-size:12px;color:var(--muted);}

/* ══════════ EMPTY / ERROR ══════════ */
.state-box{
  text-align:center;padding:80px 20px;display:none;
}
.state-box.show{display:block;}
.state-icon{font-size:52px;opacity:.35;margin-bottom:14px;}
.state-title{
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:2px;color:var(--muted);margin-bottom:8px;
}
.state-desc{font-size:13px;color:var(--muted);}

/* Global loading */
.global-loading{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;padding:80px 20px;gap:16px;
}
.global-loading.show{display:flex;}
.big-spin{
  width:44px;height:44px;
  border:3px solid rgba(255,69,0,.1);
  border-top-color:var(--c1);
  border-radius:50%;animation:spin .8s linear infinite;
}
.big-spin-lbl{font-size:13px;color:var(--muted);letter-spacing:1px;}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:900px){
  .stat-banner{grid-template-columns:repeat(2,1fr);}
  .h-meta{display:none;}
}
@media(max-width:600px){
  .mc-predictions{grid-template-columns:1fr;grid-template-rows:auto 1px auto;}
  .pred-sep{width:100%;height:1px;}
  main{padding:16px 12px 60px;}
  .mc-head,.mc-teams,.pred-block,.mc-conf{padding-left:14px;padding-right:14px;}
}
@media(max-width:420px){
  .stat-banner{grid-template-columns:1fr 1fr;}
  .h-inner{padding:0 12px;}
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="h-inner">
    <a class="logo" href="/">
      <div class="logo-gem">⚡</div>
      <div class="logo-name">BetOracle</div>
      <div class="logo-sub">Value Hunting</div>
    </a>
    <div class="h-spacer"></div>
    <div class="h-meta">
      <div class="h-stat">
        <div class="h-stat-v" id="hv-total">—</div>
        <div class="h-stat-l">Maç</div>
      </div>
      <div class="h-stat">
        <div class="h-stat-v" id="hv-hot">—</div>
        <div class="h-stat-l">Güçlü</div>
      </div>
      <div class="h-stat">
        <div class="h-stat-v" id="hv-conf">—</div>
        <div class="h-stat-l">Ort. Güven</div>
      </div>
    </div>
    <input type="date" class="h-date" id="datePicker">
    <button class="h-btn" id="btnLoad" onclick="loadFixtures()">🔄 Yükle</button>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<main>

  <!-- Stat Banner -->
  <div class="stat-banner">
    <div class="s-card">
      <div class="s-icon">🎯</div>
      <div class="s-val" id="sb-total">0</div>
      <div class="s-label">Toplam Analiz</div>
    </div>
    <div class="s-card">
      <div class="s-icon">🔥</div>
      <div class="s-val" id="sb-hot">0</div>
      <div class="s-label">Güçlü Sinyal</div>
    </div>
    <div class="s-card">
      <div class="s-icon">⚽</div>
      <div class="s-val" id="sb-iy">0</div>
      <div class="s-label">İY Üst Sinyali</div>
    </div>
    <div class="s-card">
      <div class="s-icon">📊</div>
      <div class="s-val" id="sb-conf">—%</div>
      <div class="s-label">Ort. Güven</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <span class="f-label">FİLTRE</span>
    <button class="chip on" onclick="setFilter('all',this)">Tümü</button>
    <button class="chip" onclick="setFilter('hot',this)">🔥 Güçlü</button>
    <button class="chip" onclick="setFilter('1',this)">🏠 Ev</button>
    <button class="chip" onclick="setFilter('X',this)">🤝 Beraberlik</button>
    <button class="chip" onclick="setFilter('2',this)">✈️ Deplasman</button>
    <button class="chip" onclick="setFilter('iy',this)">⚽ İY Üst</button>
  </div>

  <!-- Content -->
  <div id="globalLoading" class="global-loading">
    <div class="big-spin"></div>
    <div class="big-spin-lbl">Maçlar yükleniyor...</div>
  </div>

  <div id="emptyState" class="state-box show">
    <div class="state-icon">📋</div>
    <div class="state-title">Maç Bekleniyor</div>
    <div class="state-desc">Tarih seçip "Yükle" butonuna bas.</div>
  </div>

  <div id="errorState" class="state-box">
    <div class="state-icon">⚠️</div>
    <div class="state-title">Bağlantı Hatası</div>
    <div class="state-desc">Sofascore'a ulaşılamadı. Tekrar dene.</div>
  </div>

  <div id="matchesContainer"></div>

</main>

<script>
/* ════════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════════ */
let allMatches = [];
let filter = 'all';

/* ════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const dp = document.getElementById('datePicker');
  dp.value = todayStr();
  loadFixtures();
});

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

/* ════════════════════════════════════════════════════════
   LOAD FIXTURES → ANALYZE
════════════════════════════════════════════════════════ */
async function loadFixtures() {
  const date = document.getElementById('datePicker').value || todayStr();
  showState('loading');

  try {
    // Step 1: fikstür al
    const res = await fetch(`/api/fixtures?date=${date}`);
    const data = await res.json();

    if (!data.success || !data.matches.length) {
      showState('empty');
      return;
    }

    // Step 2: Her maç için analiz başlat (paralel)
    allMatches = data.matches.map(m => ({ ...m, analysis: null, loading: true }));
    showState('matches');
    renderAll();

    const promises = allMatches.map((m, i) =>
      fetchAnalysis(m.home_id, m.away_id).then(analysis => {
        allMatches[i].analysis = analysis;
        allMatches[i].loading  = false;
        updateCard(i);
        updateStats();
      })
    );

    await Promise.allSettled(promises);
    updateStats();

  } catch (err) {
    console.error(err);
    showState('error');
  }
}

async function fetchAnalysis(homeId, awayId) {
  try {
    const res = await fetch(`/api/analyze/${homeId}/${awayId}`);
    const data = await res.json();
    return data.analysis || null;
  } catch {
    return null;
  }
}

/* ════════════════════════════════════════════════════════
   RENDER
════════════════════════════════════════════════════════ */
function filteredMatches() {
  return allMatches.filter((m, i) => {
    m._idx = i;
    if (filter === 'all') return true;
    if (!m.analysis) return false;
    if (filter === 'hot') return isHot(m.analysis);
    if (filter === 'iy')  return m.analysis.iy05_over_pct >= 65;
    return m.analysis.prediction === filter;
  });
}

function renderAll() {
  const container = document.getElementById('matchesContainer');
  const matches = filteredMatches();

  if (!matches.length) {
    container.innerHTML = '';
    return;
  }

  // Lig gruplarına ayır
  const groups = {};
  matches.forEach(m => {
    const lg = m.league || 'Diğer';
    if (!groups[lg]) groups[lg] = [];
    groups[lg].push(m);
  });

  let html = '';
  for (const [league, list] of Object.entries(groups)) {
    html += `
    <div class="league-group">
      <div class="league-header">
        <span class="league-flag">⚽</span>
        <span class="league-title">${escHtml(league)}</span>
        <span class="league-cnt">${list.length}</span>
      </div>
      ${list.map(m => cardHtml(m)).join('')}
    </div>`;
  }
  container.innerHTML = html;
}

function updateCard(idx) {
  const el = document.getElementById(`card-${idx}`);
  if (!el) return;
  const m = allMatches[idx];
  el.outerHTML = cardHtml(m);
}

function cardHtml(m) {
  const idx  = m._idx !== undefined ? m._idx : allMatches.indexOf(m);
  const a    = m.analysis;
  const hot  = a && isHot(a);

  let predSection = '';

  if (m.loading || !a) {
    predSection = `
    <div class="mc-loading">
      <div class="spin"></div>
      <span class="spin-lbl">Analiz ediliyor...</span>
    </div>`;
  } else {
    const pickClass = (k) => a.prediction === k ? 'pick' : '';
    predSection = `
    <div class="mc-predictions">
      <!-- 1X2 -->
      <div class="pred-block">
        <div class="pred-title">1X2 TAHMİN</div>
        <div class="odds-row">
          <div class="odd-item ${pickClass('1')}">
            <div class="odd-lbl">1</div>
            <div class="odd-val">${a.odd_home}</div>
            <div class="odd-pct">${a.prob_home}%</div>
          </div>
          <div class="odd-item ${pickClass('X')}">
            <div class="odd-lbl">X</div>
            <div class="odd-val">${a.odd_draw}</div>
            <div class="odd-pct">${a.prob_draw}%</div>
          </div>
          <div class="odd-item ${pickClass('2')}">
            <div class="odd-lbl">2</div>
            <div class="odd-val">${a.odd_away}</div>
            <div class="odd-pct">${a.prob_away}%</div>
          </div>
        </div>
      </div>

      <div class="pred-sep"></div>

      <!-- İY 0.5 -->
      <div class="pred-block">
        <div class="pred-title">İLK YARI 0.5</div>
        <div class="iy-content">
          <div class="iy-bars">
            <div class="iy-row">
              <span class="iy-lbl">Üst 0.5</span>
              <div class="iy-track"><div class="iy-fill" style="width:${a.iy05_over_pct}%"></div></div>
              <span class="iy-pct hot">${a.iy05_over_pct}%</span>
            </div>
            <div class="iy-row">
              <span class="iy-lbl">Alt 0.5</span>
              <div class="iy-track"><div class="iy-fill under" style="width:${a.iy05_under_pct}%"></div></div>
              <span class="iy-pct cold">${a.iy05_under_pct}%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mc-conf">
      <div class="conf-track"><div class="conf-fill" style="width:${a.confidence}%"></div></div>
      <div class="conf-labels">
        <span class="conf-lbl">Model Güveni</span>
        <span class="conf-val">${a.confidence}%</span>
      </div>
    </div>`;
  }

  // Form dots
  const formHtml = (str) => {
    if (!str) return '';
    return str.toUpperCase().split('').slice(0,5).map(c => {
      const cls = c==='W'?'w':c==='D'?'d':'l';
      return `<div class="fd ${cls}">${c}</div>`;
    }).join('');
  };

  return `
  <div class="match-card ${hot?'hot':''}" id="card-${idx}">
    <div class="mc-topbar"></div>
    <div class="mc-head">
      <div class="mc-league">
        <span class="mc-league-name">${escHtml(m.league || '')}</span>
      </div>
      <div class="mc-right">
        <span class="mc-time">${m.time || ''}</span>
        ${hot ? '<span class="hot-badge">🔥 Hot</span>' : ''}
      </div>
    </div>
    <div class="mc-teams">
      <div class="mc-team home">
        <div class="team-icon">🏠</div>
        <div class="team-info">
          <div class="team-name">${escHtml(m.home_team)}</div>
          <div class="team-form">${formHtml(m.home_form)}</div>
        </div>
      </div>
      <div class="vs-sep">VS</div>
      <div class="mc-team away">
        <div class="team-icon">✈️</div>
        <div class="team-info">
          <div class="team-name">${escHtml(m.away_team)}</div>
          <div class="team-form">${formHtml(m.away_form)}</div>
        </div>
      </div>
    </div>
    ${predSection}
  </div>`;
}

/* ════════════════════════════════════════════════════════
   STATS
════════════════════════════════════════════════════════ */
function isHot(a) {
  if (!a) return false;
  if (a.prediction==='1' && a.prob_home >= 55) return true;
  if (a.prediction==='2' && a.prob_away >= 50) return true;
  if (a.prediction==='X' && a.prob_draw >= 38) return true;
  if (a.iy05_over_pct >= 70) return true;
  return false;
}

function updateStats() {
  const analyzed = allMatches.filter(m => m.analysis);
  const hot  = analyzed.filter(m => isHot(m.analysis)).length;
  const iy   = analyzed.filter(m => m.analysis && m.analysis.iy05_over_pct >= 65).length;
  const conf = analyzed.length
    ? Math.round(analyzed.reduce((s,m) => s + (m.analysis.confidence||0), 0) / analyzed.length)
    : 0;

  document.getElementById('hv-total').textContent = allMatches.length;
  document.getElementById('hv-hot').textContent   = hot;
  document.getElementById('hv-conf').textContent  = analyzed.length ? `${conf}%` : '—';
  document.getElementById('sb-total').textContent = analyzed.length;
  document.getElementById('sb-hot').textContent   = hot;
  document.getElementById('sb-iy').textContent    = iy;
  document.getElementById('sb-conf').textContent  = analyzed.length ? `${conf}%` : '—%';
}

/* ════════════════════════════════════════════════════════
   FILTER
════════════════════════════════════════════════════════ */
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  renderAll();
}

/* ════════════════════════════════════════════════════════
   UI STATES
════════════════════════════════════════════════════════ */
function showState(state) {
  document.getElementById('globalLoading').classList.toggle('show', state==='loading');
  document.getElementById('emptyState').classList.toggle('show', state==='empty');
  document.getElementById('errorState').classList.toggle('show', state==='error');
  if (state !== 'matches') document.getElementById('matchesContainer').innerHTML = '';
}

/* ════════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════════ */
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
